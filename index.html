<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataSphere — Database Academy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f2f6;--panel:#fff;--purple:#4b2a7b;--purple2:#6b3fa0;
  --purple-soft:#efe9f8;--orange:#ff7a45;--orange-soft:#fff1ea;
  --cyan:#1fb6cc;--cyan-soft:#e6f8fb;
  --text:#1e2233;--muted:#6d7488;--border:#e4e6ee;
  --ok:#1f9d55;--ok-soft:#e7f6ed;--bad:#d94a4a;--bad-soft:#fdeaea;
  --radius:14px;--shadow:0 2px 12px rgba(28,24,60,.07);
}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.62}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--purple2);text-decoration:none}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;background:#fff;border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;overflow-y:auto;padding:18px 14px 40px;z-index:60;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--purple),var(--purple2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.5px}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.2px;line-height:1.15}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.nav-group-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:12px 10px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;color:#3a3f52;font-size:14.5px;border:1px solid transparent;transition:.15s;user-select:none}
.nav-item:hover{background:#f5f4fa}
.nav-item.active{background:var(--purple-soft);color:var(--purple);font-weight:600;border-color:#ded2f2}
.nav-item .ico{width:20px;text-align:center;font-size:15px;opacity:.85}
.nav-item .badge{margin-left:auto;font-size:11px;background:var(--purple);color:#fff;border-radius:20px;padding:1px 7px;font-weight:700}
.nav-item .badge.done{background:var(--ok)}
.sidebar-foot{margin-top:18px;padding:12px;background:#faf9fd;border:1px dashed #ddd6ee;border-radius:12px;font-size:12px;color:var(--muted);line-height:1.5}

.main{margin-left:252px;flex:1;min-width:0}
.topbar{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:11px 24px;display:flex;gap:14px;align-items:center;z-index:40}
.hamburger{display:none;background:#fff;border:1px solid var(--border);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:17px}
.searchbar{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#f5f5f9;border:1px solid var(--border);border-radius:10px;padding:7px 12px}
.searchbar input{border:0;background:transparent;outline:0;width:100%;font-size:14px}
.search-results{position:absolute;top:56px;left:24px;right:24px;max-width:520px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:45}
.search-results div{padding:9px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid #f2f2f7}
.search-results div:hover{background:var(--purple-soft)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.pill{background:var(--cyan-soft);color:#0e7d8c;padding:4px 11px;border-radius:20px;font-weight:700;font-size:12.5px}
.pill.purple{background:var(--purple-soft);color:var(--purple)}

.content{padding:24px;max-width:1180px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.card.tight{padding:16px}

/* TYPOGRAPHY */
h1{font-size:27px;letter-spacing:-.5px;line-height:1.25;font-weight:800}
h2{font-size:21px;letter-spacing:-.3px;margin-bottom:12px;font-weight:800}
h3{font-size:17.5px;margin-bottom:10px;font-weight:700}
h4{font-size:15.5px;margin:16px 0 7px;color:var(--purple);font-weight:700}
p{margin-bottom:10px}
ul,ol{margin:0 0 12px 22px}
li{margin-bottom:5px}
code{background:#f2f1f8;padding:2px 6px;border-radius:6px;font-family:'Consolas',monospace;font-size:13.5px;color:#5b3a99}
.muted{color:var(--muted)}
.small{font-size:13px}

/* BUTTONS */
.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:#f6f5fb;border-color:#d6cfec}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:var(--purple2)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.orange:hover{filter:brightness(.94)}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* HOME */
.hero{background:linear-gradient(135deg,#43226f 0%,#5b2f96 55%,#6c3fae 100%);color:#fff;border-radius:18px;padding:38px 34px;position:relative;overflow:hidden;margin-bottom:20px}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;background:rgba(31,182,204,.22)}
.hero:before{content:"";position:absolute;right:90px;bottom:-90px;width:190px;height:190px;border-radius:50%;background:rgba(255,122,69,.20)}
.hero h1{font-size:33px;margin-bottom:10px;position:relative;z-index:2}
.hero p{max-width:640px;color:#e5dcf5;position:relative;z-index:2;margin-bottom:20px}
.hero .btn-row{position:relative;z-index:2}
.hero .btn.orange{box-shadow:0 6px 18px rgba(255,122,69,.35)}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.12)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--border);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow)}
.stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.stat .value{font-size:25px;font-weight:800;color:var(--purple);line-height:1.2;margin-top:3px}
.stat .sub{font-size:12px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.feature{background:#fff;border:1px solid var(--border);border-radius:13px;padding:17px;cursor:pointer;transition:.16s;box-shadow:var(--shadow)}
.feature:hover{transform:translateY(-2px);border-color:#cfc3ec;box-shadow:0 8px 20px rgba(75,42,123,.10)}
.feature .fi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;margin-bottom:10px;background:var(--purple-soft);color:var(--purple)}
.feature .ft{font-weight:700;margin-bottom:4px}
.feature .fd{font-size:13px;color:var(--muted)}

/* TABLES */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff}
table.dtable{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
table.dtable th{background:#f7f6fc;text-align:left;padding:10px 13px;font-weight:700;font-size:13px;color:#4a4f63;border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:.2px}
table.dtable td{padding:9px 13px;border-bottom:1px solid #f0f1f6}
table.dtable tbody tr:last-child td{border-bottom:0}
table.dtable tbody tr:hover{background:#faf9fe}
table.dtable tbody tr.selected{background:var(--purple-soft);box-shadow:inset 3px 0 0 var(--purple)}
table.dtable tbody tr.clickable{cursor:pointer}
table.dtable tbody tr.hit{background:var(--cyan-soft)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:#efeaf9;color:var(--purple)}
th .arrow{color:var(--purple);font-weight:800}

/* TASKS */
.task{background:#fbfaff;border:1px solid #e6e1f4;border-radius:14px;padding:18px;margin:16px 0}
.task-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.task-num{background:var(--orange);color:#fff;font-size:12px;font-weight:800;border-radius:7px;padding:3px 9px;letter-spacing:.3px}
.task-title{font-weight:700;font-size:15.5px}
.task-prompt{font-size:14px;color:#454b60;margin-bottom:12px}
.opts-list{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opt-check{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px;transition:.14s}
.opt-check:hover{border-color:#cfc3ec}
.opt-check.on{background:var(--purple-soft);border-color:#c9b8ea}
.opt-check input{accent-color:var(--purple);width:16px;height:16px}
.ctrl-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ctrl{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px 11px;font-size:13.5px}
.ctrl span{color:var(--muted);font-weight:600}
.ctrl select,.ctrl input{border:1px solid var(--border);border-radius:7px;padding:4px 8px;outline:0;background:#fff}
.input{border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:0;background:#fff;width:100%;max-width:340px}
.input:focus{border-color:var(--purple2);box-shadow:0 0 0 3px rgba(107,63,160,.10)}
.feedback{margin-top:12px;padding:12px 14px;border-radius:11px;font-size:14px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);color:#166b3a;border:1px solid #bfe6cf}
.feedback.bad{background:var(--bad-soft);color:#982c2c;border:1px solid #f3c9c9}
.feedback.info{background:var(--cyan-soft);color:#0e6f7d;border:1px solid #bde9ef}

/* CALLOUT */
.callout{border-left:4px solid var(--cyan);background:var(--cyan-soft);padding:13px 16px;border-radius:0 11px 11px 0;margin:14px 0;font-size:14.2px}
.callout.purple{border-color:var(--purple);background:var(--purple-soft)}
.callout.orange{border-color:var(--orange);background:var(--orange-soft)}
.callout b{color:#0e5f6b}
.callout.purple b{color:var(--purple)}
.callout.orange b{color:#b34a1e}
.steps{counter-reset:s;list-style:none;margin-left:0}
.steps li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:11px}
.steps li:before{content:counter(s);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:800}

/* QUIZ */
.quiz{margin-top:6px}
.q{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:11px}
.q-head{display:flex;gap:10px;font-weight:600;font-size:14.6px;margin-bottom:10px;align-items:flex-start}
.q-num{background:var(--purple);color:#fff;min-width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none;margin-top:1px}
.q-opts{display:grid;gap:7px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:14px;transition:.13s}
.opt:hover{background:#faf9fe;border-color:#d8cff0}
.opt input{margin-top:4px;accent-color:var(--purple)}
.opt.correct{background:var(--ok-soft);border-color:#a9dcbf}
.opt.wrong{background:var(--bad-soft);border-color:#f0bcbc}
.quiz-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.quiz-result{margin-top:14px}
.result-box{background:#fff;border:1px solid var(--border);border-radius:13px;padding:18px}
.result-score{font-size:34px;font-weight:800;color:var(--purple);line-height:1.1}
.result-verdict{font-size:16px;font-weight:700;margin:6px 0 10px}
.mini-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-bottom:12px}
.mini-stats span b{color:var(--purple)}
.review{margin-top:12px}
.review-item{border-left:3px solid var(--bad);background:#fffafa;padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:9px;font-size:13.8px}
.review-item .ans{color:var(--ok);font-weight:600}
.review-item .mine{color:var(--bad);font-weight:600}
.progressbar{height:9px;background:#eceaf4;border-radius:20px;overflow:hidden;margin:6px 0 2px}
.progressbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:20px;transition:width .4s}

/* TOPIC LIST */
.topic-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:13px;padding:14px 17px;margin-bottom:11px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.topic-row:hover{border-color:#cfc3ec;transform:translateX(3px)}
.topic-num{background:var(--purple-soft);color:var(--purple);font-weight:800;border-radius:10px;padding:8px 12px;font-size:14px;flex:none}
.topic-info{flex:1;min-width:0}
.topic-info .tt{font-weight:700;font-size:15.2px}
.topic-info .td{font-size:13px;color:var(--muted)}
.status-dot{width:11px;height:11px;border-radius:50%;background:#d8dae4;flex:none}
.status-dot.done{background:var(--ok)}

/* LAB */
.lab-filters{display:flex;flex-direction:column;gap:9px;margin:12px 0}
.cond{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--border);border-radius:11px;padding:8px 11px}
.cond select,.cond input{border:1px solid var(--border);border-radius:8px;padding:6px 9px;outline:0;background:#fff}
.cond .rm{background:#fdeaea;border:1px solid #f3c9c9;color:#b63636;border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:700}
.logic-toggle{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.logic-toggle button{border:0;background:#fff;padding:7px 16px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.logic-toggle button.on{background:var(--purple);color:#fff}
.lab-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);margin:10px 0}
.lab-meta b{color:var(--purple);font-size:15px}

/* PROJECT */
.field-chip{display:inline-flex;align-items:center;gap:7px;background:var(--purple-soft);color:var(--purple);border:1px solid #d8cdf0;border-radius:20px;padding:5px 12px;font-size:13.5px;font-weight:600;margin:0 7px 7px 0}
.field-chip .x{cursor:pointer;font-weight:800;color:#8b6bbd}
.pick-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px dashed #cfc7e6;border-radius:20px;padding:5px 12px;font-size:13.5px;margin:0 7px 7px 0;cursor:pointer}
.pick-chip:hover{background:var(--purple-soft)}
.crit{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #ececf4;font-size:14px}
.crit:last-child{border-bottom:0}
.crit .v{font-weight:800;color:var(--purple)}
.score-big{font-size:40px;font-weight:800;color:var(--purple);line-height:1}
textarea.input{max-width:100%;min-height:88px;resize:vertical}

/* MISC */
.divider{height:1px;background:var(--border);margin:18px 0}
.tagline{display:inline-block;background:var(--orange-soft);color:#b34a1e;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:20px;margin-bottom:10px;letter-spacing:.3px}
.overlay{display:none;position:fixed;inset:0;background:rgba(25,20,45,.42);z-index:55}
.overlay.show{display:block}

@media(max-width:980px){
  .sidebar{transform:translateX(-105%);box-shadow:0 10px 40px rgba(0,0,0,.18)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .hamburger{display:inline-flex;align-items:center;justify-content:center}
  .content{padding:16px}
  .hero{padding:26px 20px}
  .hero h1{font-size:25px}
  .topbar{padding:10px 14px}
  .search-results{left:14px;right:14px}
}
@media(max-width:560px){
  h1{font-size:22px}
  .card{padding:15px}
  .stat .value{font-size:21px}
  .topic-row{flex-wrap:wrap}
}
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">DS</div>
      <div>
        <div class="brand-name">DataSphere</div>
        <div class="brand-sub">Database Academy</div>
      </div>
    </div>

    <div class="nav-group-title">Негізгі</div>
    <div class="nav-item" data-nav="home"><span class="ico">🏠</span> Басты бет</div>
    <div class="nav-item" data-nav="topics"><span class="ico">📚</span> Оқу тақырыптары</div>

    <div class="nav-group-title">Практика</div>
    <div class="nav-item" data-nav="lab"><span class="ico">🧪</span> Data Lab</div>
    <div class="nav-item" data-nav="practice"><span class="ico">✍️</span> Практикалық тапсырмалар</div>
    <div class="nav-item" data-nav="project"><span class="ico">🛠️</span> Мини-жоба</div>

    <div class="nav-group-title">Бағалау</div>
    <div class="nav-item" data-nav="tests"><span class="ico">📝</span> Тақырыптық тесттер</div>
    <div class="nav-item" data-nav="final"><span class="ico">🎯</span> Қорытынды тест</div>
    <div class="nav-item" data-nav="results"><span class="ico">📊</span> Менің нәтижелерім</div>

    <div class="sidebar-foot">
      III бөлім · Деректер базасы<br>
      9-сынып информатика<br>
      <span style="color:#9a9fb5">Прогресс осы браузерде сақталады.</span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <div class="searchbar">
        <span>🔍</span>
        <input type="text" id="globalSearch" placeholder="Тақырып, термин немесе тапсырма іздеу...">
      </div>
      <div class="topbar-right">
        <span class="pill purple" id="topProgress">0%</span>
      </div>
    </header>
    <div id="searchResults" class="search-results" style="display:none"></div>
    <div class="content" id="view"></div>
  </div>
</div>

<script>
/* =========================================================================
   DATA SPHERE — DATABASE ACADEMY
   9-сынып · III бөлім «Деректер базасы»
   ========================================================================= */

/* ---------------------------- PROGRESS ---------------------------------- */
const STORAGE_KEY = 'datasphere_progress_v1';
let progress = loadProgress();

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const p = raw ? JSON.parse(raw) : null;
    if(p && typeof p === 'object'){ p.topics = p.topics||{}; return p; }
  }catch(e){}
  return {topics:{}, final:null, project:null};
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
function topicProg(id){
  if(!progress.topics[id]) progress.topics[id] = {tasks:{}, test:null};
  if(!progress.topics[id].tasks) progress.topics[id].tasks = {};
  return progress.topics[id];
}

/* ---------------------------- DATASETS ---------------------------------- */
const DATASETS = {
  library:{
    title:'📚 Кітапхана кітаптары',
    columns:[
      {key:'id',label:'ID',type:'num'},
      {key:'title',label:'Кітап атауы',type:'text'},
      {key:'author',label:'Авторы',type:'text'},
      {key:'year',label:'Шыққан жылы',type:'num'},
      {key:'genre',label:'Жанры',type:'text'},
      {key:'copies',label:'Дана саны',type:'num'}
    ],
    rows:[
      {id:1,title:'Абай жолы',author:'Мұхтар Әуезов',year:1942,genre:'Роман-эпопея',copies:5},
      {id:2,title:'Қан мен тер',author:'Әбдіжәміл Нұрпейісов',year:1961,genre:'Роман',copies:3},

/* ---------------------------- TABLE ENGINE ------------------------------- */
function applyQuery(rows, q){
  let out = rows.slice();
  const search = (q.search||'').trim().toLowerCase();
  if(search){
    const keys = q.searchKeys && q.searchKeys.length ? q.searchKeys : Object.keys(rows[0]||{});
    out = out.filter(r => keys.some(k => String(r[k]).toLowerCase().includes(search)));
  }
  (q.filters||[]).forEach(f=>{
    if(f.value === '' || f.value === null || f.value === undefined) return;
    const op = f.op || '=';
    if(op === '=') out = out.filter(r => String(r[f.key]).toLowerCase() === String(f.value).toLowerCase());
    else if(op === 'contains') out = out.filter(r => String(r[f.key]).toLowerCase().includes(String(f.value).toLowerCase()));
    else {
      const b = Number(f.value);
      if(isNaN(b)) return;
      out = out.filter(r => {
        const a = Number(r[f.key]);
        if(isNaN(a)) return false;
        if(op === '>') return a > b;
        if(op === '<') return a < b;
        if(op === '>=') return a >= b;
        if(op === '<=') return a <= b;
        return a === b;
      });
    }
  });
  if(q.sortKey){
    const dir = q.sortDir === 'desc' ? -1 : 1;
    out = out.map((r,i)=>({r,i})).sort((x,y)=>{
      const a = x.r[q.sortKey], b = y.r[q.sortKey];
      let cmp;
      if(typeof a === 'number' && typeof b === 'number') cmp = a - b;
      else cmp = String(a).localeCompare(String(b), 'kk');
      if(cmp === 0) return x.i - y.i;
      return cmp * dir;
    }).map(o=>o.r);
  }
  return out;
}
function tableHTML(columns, rows, opts){
  opts = opts||{};
  const head = columns.map(c=>{
    const cls = opts.sortable ? 'sortable' : '';
    let arrow = '';
    if(opts.sortable && opts.sortKey === c.key) arrow = opts.sortDir==='desc' ? ' ↓' : ' ↑';
    return `<th class="${cls}" ${opts.sortable?`data-sortkey="${c.key}"`:''} ${opts.tableId?`data-tableid="${opts.tableId}"`:''}>${c.label}${arrow?`<span class="arrow">${arrow}</span>`:''}</th>`;
  }).join('');
  const body = rows.map(r=>{
    const cls = (opts.rowClass?opts.rowClass(r):'');
    return `<tr class="${cls}" ${opts.rowAttrs?opts.rowAttrs(r):''}>${columns.map(c=>`<td>${r[c.key]}</td>`).join('')}</tr>`;
  }).join('');
  const empty = `<tr><td colspan="${columns.length}" style="text-align:center;color:#8b90a3;padding:22px">Сәйкес жазба табылмады</td></tr>`;
  return `<div class="tablewrap"><table class="dtable"><thead><tr>${head}</tr></thead><tbody>${rows.length?body:empty}</tbody></table></div>`;
}

<p>Microsoft Excel — кестелік процессор. Ол деректерді сақтауға, есептеуге, сұрыптауға, сүзгілеуге және диаграмма құруға мүмкіндік береді. Excel-де құрылған кестені толыққанды <b>деректер базасы</b> ретінде пайдалануға болады.</p>
<p>Excel жұмыс парағы <b>ұяшықтардан</b> тұрады. Әр ұяшықтың өз мекенжайы бар: баған әрпі + жол нөмірі (мысалы, <code>A1</code>, <code>C5</code>).</p>

<h4>2. Деректер базасына арналған кесте құру</h4>
<p>Excel-де деректер базасын құру келесі ретпен жүзеге асады:</p>
<ol>
<li>Жұмыс парағының бірінші жолына <b>баған атауларын</b> енгізу.</li>
<li>Әр бағанға <b>бір типтегі</b> ақпаратты енгізу.</li>
<li>Әр жазбаны (объектіні) <b>жеке жолға</b> орналастыру.</li>
<li>Кестені форматтау (шекаралар, қою қаріп, фон түсі).</li>
</ol>

<h4>3. Баған атауларын енгізу</h4>
<p>Баған атауы қысқа, нақты және қайталанбайтын болуы керек. Мысалы: <code>ID</code>, <code>Кітап атауы</code>, <code>Авторы</code>, <code>Шыққан жылы</code>, <code>Жанры</code>, <code>Дана саны</code>.</p>
<div class="callout purple"><b>Есте сақта:</b> Баған атаулары біріктірілген ұяшықтарда болмауы керек. Әр атау — жеке бір ұяшықта.</div>

<h4>4. Деректерді жолдар бойынша орналастыру</h4>
<p>Әр жол — бір объект туралы толық ақпарат. Мысалы, бір кітап туралы барлық мәлімет бір жолда тұруы керек:</p>
<div class="tablewrap" style="margin:10px 0">
<table class="dtable">
<thead><tr><th>ID</th><th>Кітап атауы</th><th>Авторы</th><th>Шыққан жылы</th><th>Дана саны</th></tr></thead>
<tbody>
<tr><td>1</td><td>Абай жолы</td><td>Мұхтар Әуезов</td><td>1942</td><td>5</td></tr>
<tr><td>2</td><td>Қан мен тер</td><td>Әбдіжәміл Нұрпейісов</td><td>1961</td><td>3</td></tr>
</tbody>
</table>
</div>

<h4>5. Әр бағанға бір типтегі ақпаратты енгізу</h4>
<ul>
<li><b>Мәтіндік</b> деректер: атауы, авторы, жанры.</li>
<li><b>Сандық</b> деректер: ID, шыққан жылы, дана саны.</li>
<li><b>Күн</b> типті деректер: келіп түскен күні, туған күні.</li>
</ul>
<p>Егер «Шыққан жылы» бағанына «мың тоғыз жүз қырық екі» деп жазсақ, сұрыптау дұрыс жұмыс істемейді.</p>

<h4>6. Бос жолдар мен бағандардан аулақ болу</h4>
<p>Кесте ішіндегі бос жолдар сүзгілеу мен сұрыптау кезінде қателікке әкеледі. Excel бос жолды кестенің соңы деп қабылдауы мүмкін, сондықтан қалған жазбалар есепке алынбайды.</p>

<h4>7. Қайталанатын және қате деректер</h4>
<ul>
<li>Бір жазбаның екі рет жазылуы — <b>қайталанатын жазба</b>.</li>
<li>Қате жазылған мән (мысалы, «9А» орнына «9а» немесе «АА») — <b>қате дерек</b>.</li>
<li>Қате деректер іздеу мен сүзгілеу нәтижесін бұрмалайды.</li>
</ul>

<h4>8. Кестені форматтау</h4>
<ul>
<li>Баған атауларын <b>қою қаріппен</b> және фон түсімен ерекшелеу.</li>
<li>Кестеге жұқа шекаралар қою.</li>
<li>Баған енін мазмұнға қарай реттеу.</li>
<li>Сандық мәндерді оң жаққа, мәтінді сол жаққа туралау.</li>
<li>Ұзын кестелерде бірінші жолды бекіту (<i>View → Freeze Panes</i>).</li>
</ul>

<h4>9. Деректерді кейін іздеуге, сұрыптауға және сүзгілеуге дайындау</h4>
<div class="callout"><b>Дайын кестенің белгілері:</b> бірінші жол — атаулар; бос жолдар жоқ; әр бағанда бір типті деректер; қайталанатын жазбалар жойылған; бірегей ID бар.</div>
`,

<h4>3. Іздеу жолағын пайдалану</h4>
<p>Excel-де іздеу үшін <code>Ctrl + F</code> пернелер тіркесімін басу керек. Ашылаған терезеге ізделетін сөзді немесе мәнді енгізіп, <b>Find All</b> (Барлығын табу) немесе <b>Find Next</b> (Келесіні табу) батырмасын басамыз.</p>

<li>нақты санды жазсақ — сол мәні бар ұяшықтар табылады.</li>
</ul>

<p><b>Кеңейтілген сүзгі</b> (<i>Advanced Filter</i>) — Excel-дің қуатты құралы. Ол кестедегі кірістірілген ▼ сүзгісі сияқты бір баған бойынша ғана емес, <b>бірнеше өріс</b> бойынша және <b>күрделі логикалық шарттармен</b> деректерді іріктеуге мүмкіндік береді.</p>

<h4>2. Қарапайым сүзгі мен кеңейтілген сүзгінің айырмашылығы</h4>
<div class="tablewrap">
<table class="dtable">
<thead><tr><th>Қарапайым сүзгі</th><th>Кеңейтілген сүзгі</th></tr></thead>
<tbody>
<tr><td>Кесте үстіндегі ▼ белгісі арқылы қойылады</td><td>Шарттар ауқымы арқылы қойылады</td></tr>
<tr><td>Әр бағанға бір шарт</td><td>Бір өріске бірнеше шарт қоюға болады</td></tr>
<tr><td>AND логикасы ғана (бағандар арасында)</td><td>AND және OR логикасын еркін қолдану</td></tr>
<tr><td>Нәтиже сол кестеде көрінеді</td><td>Нәтижені басқа жерге көшіруге болады</td></tr>
<tr><td>Есептелген өрнектерді қолдамайды</td><td>Есептелген шарттарды қолдайды</td></tr>
</tbody>
</table>
</div>

<h4>3. Шарттар ауқымы туралы түсінік</h4>
<p><b>Шарттар ауқымы</b> (<i>Criteria Range</i>) — кестеден бөлек орналасқан кішкене аймақ. Оның бірінші жолында <b>өріс атаулары</b> (кестедегі атаулармен дәл бірдей), ал келесі жолдарда <b>шарттар</b> жазылады.</p>
<p>Шарттар ауқымын кестенің жоғарғы жағына немесе бүйіріне орналастыруға болады. Ең бастысы — ол кестемен тікелей жалғаспауы керек (арасында кемінде бір бос жол болуы тиіс).</p>

<h4>4. Бірнеше шартпен деректерді іріктеу</h4>
<p>Шарттар ауқымында бірнеше өрістің атауын жазып, әрқайсысының астына шарт қоюға болады.</p>

<h4>5. AND және OR логикасы</h4>
<div class="callout purple">
<b>AND (ЖӘНЕ)</b> — барлық шарт орындалуы керек. Шарттар <b>бір жолға</b> жазылады.<br><br>
<b>OR (НЕМЕСЕ)</b> — кемінде бір шарт орындалса жеткілікті. Шарттар <b>әртүрлі жолдарға</b> жазылады.
</div>
<p><b>AND мысалы:</b></p>
<div class="tablewrap"><table class="dtable">
<thead><tr><th>Сынып</th><th>Информатика</th></tr></thead>
<tbody><tr><td>9А</td><td>&gt;4</td></tr></tbody>
</table></div>
<p class="small muted">Мағынасы: сыныбы 9А <b>және</b> информатика бағасы 4-тен жоғары.</p>

<p><b>OR мысалы:</b></p>
<div class="tablewrap"><table class="dtable">
<thead><tr><th>Сынып</th><th>Информатика</th></tr></thead>
<tbody>
<tr><td>9А</td><td></td></tr>
<tr><td>9Б</td><td></td></tr>
</tbody></table></div>
<p class="small muted">Мағынасы: сыныбы 9А <b>немесе</b> 9Б.</p>

<h4>6. Бір уақытта бірнеше өрісті пайдалану</h4>
<p>Шарттар ауқымына үш, төрт немесе одан да көп өріс қосуға болады. Әр қосымша өріс AND логикасы бойынша бірігеді (егер бір жолда тұрса).</p>

<h4>7. Іріктеу нәтижелерін тексеру</h4>
<ul>
<li>Шарттар ауқымындағы өріс атаулары кестедегі атаулармен дәл сәйкес пе?</li>
<li>AND шарттары бір жолда, OR шарттары әртүрлі жолдарда жазылған ба?</li>
<li>Нәтижедегі жазбалар саны күткенге сай ма?</li>
<li>Шарттар ауқымы кестемен жалғасып кетпеген бе?</li>
</ul>

<h4>8. Қайталанбайтын жазбаларды таңдау</h4>
<p>Кеңейтілген сүзгі терезесінде <b>«Unique records only»</b> (Тек бірегей жазбалар) белгісін қоюға болады. Сонда қайталанатын жазбалардың біреуі ғана қалады.</p>
<div class="callout orange"><b>Мысалы:</b> Егер «Авторы» бағанында «Мұхтар Әуезов» екі рет кездессе, осы опция қосылғанда ол бір рет қана көрсетіледі.</div>
`,

theory:`
<h4>1. Жобалық жұмыстың мақсаты</h4>
<p>Осы тарауда біз деректер базасының негіздерін, Excel-де кесте құруды, іздеуді, сұрыптауды, сүзгілеуді және кеңейтілген сүзгіні үйрендік. Енді осы білімді тәжірибеде біріктіріп, <b>мини-жоба</b> орындаймыз.</p>

<h4>2. Жоба тақырыптары</h4>
<ol>
<li>Мектеп кітапханасының деректер базасы.</li>

<li>Сынып оқушыларының үлгі деректер базасы.</li>
<li>Мектептегі іс-шаралар кестесі.</li>
</ol>

<ol class="steps">
<li><b>Жоба тақырыбын таңдау.</b> Қай деректер базасын құратыныңды анықта.</li>

<li><b>Өрістерді таңдау.</b> Объектінің қандай қасиеттері сақталады?</li>
<li><b>Үлгі деректер енгізу.</b> Кемінде 5–10 жазба толтыр.</li>
<li><b>Деректерді іздеу.</b> Кемінде бір іздеу жүргіз.</li>
<li><b>Сұрыптау.</b> Кемінде бір баған бойынша сұрыпта.</li>
<li><b>Сүзгілеу.</b> Бір шарт бойынша сүзгі қолдан.</li>
<li><b>Кеңейтілген сүзгі.</b> Екі шартты AND/OR арқылы қолдан.</li>
<li><b>Нәтижені талдау.</b> Алынған нәтижелерді түсіндір.</li>
<li><b>Қорытынды жасау.</b> Не үйрендің, қандай қиындық болды?</li>
</ol>

<h4>4. Бағалау критерийлері</h4>

<tr><td>Сұрыптау</td><td>15%</td></tr>

<tr><td>Қорытынды және рәсімдеу</td><td>15%</td></tr>
</tbody></table></div>

<h4>5. Нәтижені рәсімдеу</h4>
<ul>
<li>Кестенің атауын және мақсатын жаз.</li>
<li>Өріс атауларын қою қаріппен ерекшеле.</li>

<li>Орындалған әрекеттерді (іздеу, сұрыптау, сүзгілеу) қысқаша сипатта.</li>
<li>Қорытынды бөлімде не үйренгеніңді жаз.</li>
</ul>

/* =========================================================================
   QUIZ REGISTRY & RENDER
   ========================================================================= */
const QUIZZES = {};

function registerQuizzes(){
  TOPICS.forEach(t=>{
    QUIZZES['test-'+t.id] = {questions:TESTS[t.id], title:t.num+' · '+t.title, kind:'topic', topicId:t.id};
    (t.tasks||[]).forEach(task=>{
      if(task.type === 'quiz'){
        QUIZZES['task-'+task.id] = {questions:task.questions, title:task.title, kind:'task'};
      }
    });
  });
  QUIZZES['final'] = {questions:FINAL_TEST, title:'III бөлім бойынша қорытынды тест', kind:'final'};
}

function quizHTML(questions, qid){
  return `<div class="quiz" data-quiz="${qid}">
    ${questions.map((q,i)=>`
      <div class="q" data-qidx="${i}">
        <div class="q-head"><span class="q-num">${i+1}</span><span>${q.q}</span></div>
        <div class="q-opts">
          ${q.o.map((o,j)=>`<label class="opt" data-opt="${j}">
            <input type="radio" name="${qid}-${i}" value="${j}">
            <span>${o}</span>
          </label>`).join('')}
        </div>
      </div>`).join('')}
    <div class="quiz-actions">
      <button class="btn primary" data-action="quiz-submit" data-quiz="${qid}">Тесті аяқтау</button>
      <button class="btn ghost" data-action="quiz-reset" data-quiz="${qid}">Қайта тапсыру</button>
    </div>
    <div class="quiz-result" id="res-${qid}"></div>
  </div>`;
}

function submitQuiz(qid){
  const quiz = QUIZZES[qid];
  if(!quiz) return;
  const root = document.querySelector(`.quiz[data-quiz="${qid}"]`);
  if(!root) return;
  const answers = [];
  let unanswered = 0;
  quiz.questions.forEach((q,i)=>{
    const sel = root.querySelector(`input[name="${qid}-${i}"]:checked`);
    if(!sel) unanswered++;
    answers.push(sel ? Number(sel.value) : -1);
  });
  if(unanswered > 0 && !confirm(`${unanswered} сұраққа жауап берілмеді. Тесті аяқтайсыз ба?`)) return;

  let correct = 0;
  const wrong = [];
  quiz.questions.forEach((q,i)=>{
    const ok = answers[i] === q.a;
    if(ok) correct++; else wrong.push({i, q, mine:answers[i]});
    const qEl = root.querySelector(`.q[data-qidx="${i}"]`);
    qEl.querySelectorAll('.opt').forEach(op=>{
      const j = Number(op.dataset.opt);
      op.classList.remove('correct','wrong');
      op.querySelector('input').disabled = true;
      if(j === q.a) op.classList.add('correct');
      else if(j === answers[i]) op.classList.add('wrong');
    });
  });

  const total = quiz.questions.length;
  const percent = Math.round(correct/total*100);
  let verdict, cls;
  if(percent >= 90){ verdict = 'Өте жақсы! 🎉'; cls='ok'; }
  else if(percent >= 75){ verdict = 'Жақсы! 👍'; cls='ok'; }
  else if(percent >= 50){ verdict = 'Қайталап оқы. 📖'; cls='info'; }
  else { verdict = 'Теорияны қайта қарап, тағы тапсыр. 🔁'; cls='bad'; }

  const resEl = document.getElementById('res-'+qid);
  resEl.innerHTML = `
    <div class="result-box">
      <div class="result-score">${percent}%</div>
      <div class="progressbar"><i style="width:${percent}%"></i></div>
      <div class="result-verdict">${verdict}</div>
      <div class="mini-stats">
        <span>Дұрыс жауап: <b>${correct}</b></span>
        <span>Қате жауап: <b>${total-correct}</b></span>
        <span>Барлық сұрақ: <b>${total}</b></span>
      </div>
      ${wrong.length ? `<div class="review"><b>Қате сұрақтарды талдау:</b>
        ${wrong.map(w=>`<div class="review-item">
          <div><b>${w.i+1}.</b> ${w.q.q}</div>
          <div class="mine">Сенің жауабың: ${w.mine>=0 ? w.q.o[w.mine] : '— жауап берілмеді'}</div>
          <div class="ans">Дұрыс жауап: ${w.q.o[w.q.a]}</div>
          <div class="small muted">${w.q.e}</div>
        </div>`).join('')}
      </div>` : `<div class="feedback ok show">Барлық сұраққа дұрыс жауап бердің! Керемет!</div>`}
    </div>`;

  if(quiz.kind === 'topic'){
    const tp = topicProg(quiz.topicId);
    tp.test = {correct, total, percent, date:new Date().toISOString()};
    saveProgress(); updateTopProgress();
  } else if(quiz.kind === 'final'){
    progress.final = {correct, total, percent, date:new Date().toISOString()};
    saveProgress(); updateTopProgress();
  }
}

function resetQuiz(qid){
  const root = document.querySelector(`.quiz[data-quiz="${qid}"]`);
  if(!root) return;
  root.querySelectorAll('input[type=radio]').forEach(i=>{ i.checked=false; i.disabled=false; });
  root.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
  const resEl = document.getElementById('res-'+qid);
  if(resEl) resEl.innerHTML = '';
}

  else if(task.type === 'tabletask'){

  }
  else if(task.type === 'fillblanks'){

  }
  else if(task.type === 'clickerrors'){

  return `<div class="task" data-task-id="${task.id}">

/* ---------------- tabletask (sort / filter / find) ---------------------- */
function tabletaskHTML(task){
  if(!TT_STATE[task.id]){
    TT_STATE[task.id] = {
      search:'', sortKey:null, sortDir:'asc', filters:{},
      ops:{}, sortClicks:0
    };
  }
  let controls = '';
  if(task.mode === 'find'){
    controls = `<div class="ctrl-row">
      <div class="ctrl" style="flex:1;max-width:340px"><span>🔍</span>
        <input type="text" placeholder="Іздеу..." style="border:0;outline:0;width:100%" data-tt-search="${task.id}">
      </div>
      <span class="small muted">Қажетті жолды басып таңда</span>
    </div>`;
  }
  if(task.mode === 'filter'){
    controls = `<div class="ctrl-row">` + task.controls.map(c=>{
      if(c.kind === 'select'){
        const vals = [...new Set(task.rows.map(r=>r[c.key]))].sort((a,b)=>String(a).localeCompare(String(b),'kk'));
        return `<label class="ctrl"><span>${c.label}</span>
          <select data-tt-filter="${task.id}" data-key="${c.key}">
            <option value="">Барлығы</option>
            ${vals.map(v=>`<option value="${v}">${v}</option>`).join('')}
          </select></label>`;
      }
      if(c.kind === 'num'){
        return `<label class="ctrl"><span>${c.label}</span>
          <select data-tt-op="${task.id}" data-key="${c.key}">
            ${['>','<','=','>=','<='].map(op=>`<option value="${op}" ${c.fixedOp===op?'selected':''}>${op.replace('>','&gt;').replace('<','&lt;')}</option>`).join('')}
          </select>
          <input type="number" placeholder="мән" data-tt-num="${task.id}" data-key="${c.key}" style="width:90px">
        </label>`;
      }
      return '';
    }).join('') + `<button class="btn ghost small" data-tt-clear="${task.id}">Сүзгіні тазалау</button></div>`;
  }
  if(task.mode === 'sort'){
    controls = `<div class="ctrl-row">
      <span class="small muted">Баған атауын бас — сұрыптау бағыты ауысады:</span>
      ${task.columns.map(c=>`<button class="btn small" data-tt-sort="${task.id}" data-key="${c.key}">${c.label} <span data-tt-arrow="${task.id}-${c.key}"></span></button>`).join('')}
    </div>`;
  }
  return `<div class="tabletask" data-tt="${task.id}">
    ${controls}
    <div data-tt-body="${task.id}"></div>
    <div class="ctrl-row" style="margin-top:12px">
      <button class="btn primary small" data-tt-check="${task.id}">Тексеру</button>
      <span class="small muted" data-tt-count="${task.id}"></span>
    </div>
  </div>`;
}

function ttGetRows(task){
  const st = TT_STATE[task.id];
  const filters = Object.keys(st.filters).map(k=>({key:k, value:st.filters[k], op:st.ops[k]||'='}));
  return applyQuery(task.rows, {
    search: st.search,
    searchKeys: task.searchKeys || task.columns.map(c=>c.key),
    filters: filters,
    sortKey: st.sortKey,
    sortDir: st.sortDir
  });
}

function ttRender(task){
  const st = TT_STATE[task.id];
  const rows = ttGetRows(task);
  const opts = {
    sortable: task.mode === 'sort',
    sortKey: st.sortKey,
    sortDir: st.sortDir
  };
  let rowAttrs = '';
  if(task.mode === 'find'){ opts.rowClass = ()=>'clickable'; opts.rowAttrs = r=>`data-tt-row="${task.id}" data-rowid="${r.id}"`; }
  if(task.mode === 'filter'){ opts.rowAttrs = r=>`data-rowid="${r.id}"`; }

  const bodyEl = document.querySelector(`[data-tt-body="${task.id}"]`);
  if(bodyEl) bodyEl.innerHTML = tableHTML(task.columns, rows, opts);
  const cntEl = document.querySelector(`[data-tt-count="${task.id}"]`);
  if(cntEl) cntEl.textContent = `Көрсетілген жазба саны: ${rows.length} / ${task.rows.length}`;
  if(task.mode === 'sort'){
    task.columns.forEach(c=>{
      const el = document.querySelector(`[data-tt-arrow="${task.id}-${c.key}"]`);
      if(el) el.textContent = (st.sortKey === c.key) ? (st.sortDir === 'desc' ? '↓' : '↑') : '';
    });
  }
}

/* =========================================================================

   ========================================================================= */
const LAB = {
  ds:'library', search:'', sortKey:null, sortDir:'asc',
  logic:'AND', conds:[], searchKeys:null
};

function labConditions(){
  return LAB.conds.filter(c=>c.value !== '' && c.value !== null && c.value !== undefined);
}
function labQuery(){
  const ds = DATASETS[LAB.ds];
  const conds = labConditions();
  let rows;
  if(conds.length === 0){
    rows = applyQuery(ds.rows, {search:LAB.search, sortKey:LAB.sortKey, sortDir:LAB.sortDir});
  } else if(LAB.logic === 'AND'){
    rows = applyQuery(ds.rows, {search:LAB.search, filters:conds, sortKey:LAB.sortKey, sortDir:LAB.sortDir});
  } else {
    // OR: біріктіру
    const sets = conds.map(c=>applyQuery(ds.rows, {filters:[c]}));
    const map = new Map();
    sets.forEach(s=>s.forEach(r=>map.set(r.id, r)));
    rows = [...map.values()];
    if(LAB.search){
      const q = LAB.search.toLowerCase();
      rows = rows.filter(r => Object.keys(r).some(k=>String(r[k]).toLowerCase().includes(q)));
    }
    if(LAB.sortKey){
      const dir = LAB.sortDir === 'desc' ? -1 : 1;
      rows = rows.map((r,i)=>({r,i})).sort((x,y)=>{
        const a=x.r[LAB.sortKey], b=y.r[LAB.sortKey];
        let cmp = (typeof a==='number'&&typeof b==='number') ? a-b : String(a).localeCompare(String(b),'kk');
        return cmp===0 ? x.i-y.i : cmp*dir;
      }).map(o=>o.r);
    }
  }
  return rows;
}

];
const FIELD_POOL = ['Мұғалімнің телефоны','Ауа райы болжамы','Сабақ кестесі','Кітап мұқабасының түсі','Оқушының сүйікті әні','Автобус нөмірі'];

let projectState = null;
function initProjectState(){
  if(progress.project && progress.project.state){ projectState = progress.project.state; }
  else{
    projectState = {typeId:null, title:'', fields:[], pool:[...FIELD_POOL], rows:[], done:{search:false,sort:false,filter:false,advanced:false}, conclusion:'', score:null};
  }
  if(!projectState.rows) projectState.rows = [];
  if(!projectState.done) projectState.done = {search:false,sort:false,filter:false,advanced:false};
  if(!projectState.pool) projectState.pool = [...FIELD_POOL];
}
function saveProject(){
  if(!progress.project) progress.project = {};
  progress.project.state = projectState;
  saveProgress();
}

function projectScore(){
  const s = projectState;
  let structure = 0, data = 0, search = 0, sort = 0, filter = 0, conclusion = 0;

  // Кесте құрылымы 20
  if(s.typeId) structure += 5;
  if(s.title && s.title.trim().length >= 3) structure += 5;
  if(s.fields.length >= 4) structure += 6;
  else if(s.fields.length > 0) structure += Math.round(s.fields.length/4*6);
  if(s.fields.some(f=>/id/i.test(f))) structure += 4;

  // Деректердің дұрыстығы 20
  if(s.rows.length >= 3) data += 8;
  else data += Math.round(s.rows.length/3*8);
  const emptyCells = s.rows.reduce((n,r)=>n + s.fields.filter(f=>r[f]===undefined||r[f]==='').length, 0);
  if(s.rows.length && emptyCells === 0) data += 7;
  else if(s.rows.length) data += Math.max(0, 7 - emptyCells);
  const ids = s.rows.map(r=>r[s.fields[0]]).filter(v=>v!==undefined&&v!=='');
  const uniqueIds = new Set(ids);
  if(ids.length && uniqueIds.size === ids.length) data += 5;

  if(s.done.search) search = 15;
  if(s.done.sort) sort = 15;
  if(s.done.filter) filter = 15;
  if(s.done.advanced) filter = 15; // кеңейтілген сүзгі де сол санатқа кіреді

  if(s.conclusion && s.conclusion.trim().length >= 40) conclusion = 15;
  else if(s.conclusion && s.conclusion.trim().length > 0) conclusion = Math.round(s.conclusion.trim().length/40*15);

  const total = Math.min(100, structure + data + search + sort + filter + conclusion);
  return {
    structure:Math.min(20,structure), data:Math.min(20,data),
    search, sort, filter, conclusion, total
  };
}

function renderProjTable(){
  const s = projectState;
  let rows = s.rows.slice();
  const search = (s._search||'').trim().toLowerCase();
  if(search){
    rows = rows.filter(r=>s.fields.some(f=>String(r[f]||'').toLowerCase().includes(search)));
  }
  if(s._filterKey && s._filterVal){
    const v = String(s._filterVal).toLowerCase();
    rows = rows.filter(r=>String(r[s._filterKey]||'').toLowerCase().includes(v));
  }
  if(s._sortKey){
    const dir = s._sortDir === 'desc' ? -1 : 1;
    rows = rows.map((r,i)=>({r,i})).sort((x,y)=>{
      const a = x.r[s._sortKey], b = y.r[s._sortKey];
      const na = Number(a), nb = Number(b);
      let cmp;
      if(a!=='' && b!=='' && !isNaN(na) && !isNaN(nb)) cmp = na - nb;
      else cmp = String(a||'').localeCompare(String(b||''), 'kk');
      return cmp === 0 ? x.i - y.i : cmp*dir;
    }).map(o=>o.r);
  }
  s._viewRows = rows;
  const el = document.getElementById('projTable');
  if(el) el.innerHTML = tableHTML(s.fields.map(f=>({key:f,label:f})), rows);
}

function renderProjResult(){
  const s = projectState;
  const el = document.getElementById('projResult');
  if(!el) return;
  if(s.score === null || s.score === undefined){
    el.innerHTML = '';
    return;
  }
  const sc = s.score;
  let fb = '';
  if(sc.total >= 90) fb = 'Өте жақсы! Жоба толық талапқа сай орындалды. 🎉';
  else if(sc.total >= 75) fb = 'Жақсы! Кейбір бөліктерді толықтыруға болады. 👍';
  else if(sc.total >= 50) fb = 'Орташа. Жобаның жетіспейтін бөліктерін толықтыр. 📖';
  else fb = 'Жоба толық орындалмаған. Кезеңдерді қайта қарап, аяқта. 🔁';

  el.innerHTML = `
    <div class="result-box" style="margin-top:16px">
      <div class="score-big">${sc.total} / 100</div>
      <div class="progressbar"><i style="width:${sc.total}%"></i></div>
      <div class="result-verdict">${fb}</div>
      <div style="margin-top:10px">
        <div class="crit"><span>Кесте құрылымы</span><span class="v">${sc.structure} / 20</span></div>
        <div class="crit"><span>Деректердің дұрыстығы</span><span class="v">${sc.data} / 20</span></div>
        <div class="crit"><span>Іздеу</span><span class="v">${sc.search} / 15</span></div>
        <div class="crit"><span>Сұрыптау</span><span class="v">${sc.sort} / 15</span></div>
        <div class="crit"><span>Сүзгілеу</span><span class="v">${sc.filter} / 15</span></div>
        <div class="crit"><span>Қорытынды және рәсімдеу</span><span class="v">${sc.conclusion} / 15</span></div>
      </div>
    </div>`;
}

function updateTopProgress(){
  let doneCount = 0;
  TOPICS.forEach(t=>{
    const p = progress.topics[t.id];
    if(p && p.test) doneCount++;
  });
  const totalPoints = doneCount * 100 + (progress.final ? progress.final.percent : 0);
  const maxPoints = TOPICS.length * 100 + 100;
  const pct = Math.round(totalPoints / maxPoints * 100);
  const el = document.getElementById('topProgress');
  if(el) el.textContent = pct + '%';
}

function renderSidebar(){
  document.querySelectorAll('.nav-item').forEach(el=>{

    if(n === route.name) active = true;
    if(n === 'topics' && route.name === 'topic') active = true;
    if(n === 'tests' && route.name === 'test') active = true;
    el.classList.toggle('active', active);
  });
}

}

/* ----------------------------- RESULTS ---------------------------------- */

    const p = progress.topics[t.id];
    if(p && p.test){ testsDone++; sumPct += p.test.percent; }
  });
  const avg = testsDone ? Math.round(sumPct/testsDone) : 0;
  const overall = Math.round((testsDone/7*60) + (progress.final ? progress.final.percent*0.25 : 0) + (progress.project && progress.project.state && progress.project.state.score ? progress.project.state.score.total*0.15 : 0));

  view.innerHTML = `
    <h1>📊 Менің нәтижелерім</h1>
    <p class="muted" style="margin-bottom:16px">Барлық нәтижелер браузердің <code>localStorage</code> жадында сақталады. Бетті жаңартқанда да жоғалмайды.</p>

    <div class="stats">
      <div class="stat"><div class="label">Аяқталған тақырып</div><div class="value">${testsDone}/7</div><div class="sub">тест тапсырылды</div></div>
      <div class="stat"><div class="label">Орташа нәтиже</div><div class="value">${avg}%</div><div class="sub">тақырыптық тесттер</div></div>
      <div class="stat"><div class="label">Қорытынды тест</div><div class="value">${progress.final ? progress.final.percent+'%' : '—'}</div><div class="sub">${progress.final ? progress.final.correct+'/'+progress.final.total : 'тапсырылмаған'}</div></div>
      <div class="stat"><div class="label">Мини-жоба</div><div class="value">${progress.project && progress.project.state && progress.project.state.score ? progress.project.state.score.total : '—'}</div><div class="sub">100 балдан</div></div>
    </div>

    <div class="card">
      <h2>Жалпы прогресс</h2>
      <div class="progressbar" style="height:14px"><i style="width:${Math.min(100,overall)}%"></i></div>
      <div class="small muted" style="margin-top:6px">Жалпы меңгеру деңгейі: <b style="color:var(--purple)">${Math.min(100,overall)}%</b></div>
    </div>

    <div class="card">
      <h2>Тақырыптар бойынша нәтиже</h2>
      <div class="tablewrap"><table class="dtable">
        <thead><tr><th>№</th><th>Тақырып</th><th>Тапсырмалар</th><th>Тест нәтижесі</th><th>Пайыз</th></tr></thead>
        <tbody>
        ${TOPICS.map(t=>{
          const p = progress.topics[t.id] || {tasks:{}, test:null};
          const tasksDone = Object.keys(p.tasks||{}).length;
          return `<tr>
            <td>${t.num}</td>
            <td>${t.title}</td>
            <td>${tasksDone}/2</td>
            <td>${p.test ? p.test.correct+'/'+p.test.total : '—'}</td>
            <td>${p.test ? `<b style="color:var(--purple)">${p.test.percent}%</b>` : '<span class="muted">—</span>'}</td>
          </tr>`;
        }).join('')}
        <tr>
          <td>—</td>
          <td><b>Қорытынды тест</b></td>
          <td>—</td>
          <td>${progress.final ? progress.final.correct+'/'+progress.final.total : '—'}</td>
          <td>${progress.final ? `<b style="color:var(--purple)">${progress.final.percent}%</b>` : '<span class="muted">—</span>'}</td>
        </tr>
        </tbody>
      </table></div>
    </div>

    <div class="card">
      <h2>Мини-жоба бағасы</h2>
      ${progress.project && progress.project.state && progress.project.state.score ? `
        <div class="score-big">${progress.project.state.score.total} / 100</div>
        <div class="progressbar"><i style="width:${progress.project.state.score.total}%"></i></div>
        <div style="margin-top:12px">
          <div class="crit"><span>Кесте құрылымы</span><span class="v">${progress.project.state.score.structure} / 20</span></div>
          <div class="crit"><span>Деректердің дұрыстығы</span><span class="v">${progress.project.state.score.data} / 20</span></div>
          <div class="crit"><span>Іздеу</span><span class="v">${progress.project.state.score.search} / 15</span></div>
          <div class="crit"><span>Сұрыптау</span><span class="v">${progress.project.state.score.sort} / 15</span></div>
          <div class="crit"><span>Сүзгілеу</span><span class="v">${progress.project.state.score.filter} / 15</span></div>
          <div class="crit"><span>Қорытынды және рәсімдеу</span><span class="v">${progress.project.state.score.conclusion} / 15</span></div>
        </div>
      ` : '<p class="muted">Мини-жоба әзірге бағаланбаған. <button class="btn small primary" data-nav-btn="project" style="margin-left:8px">Жобаға өту</button></p>'}

      </div>
      <button class="btn ghost" id="resetProgress" style="color:var(--bad);border-color:#f3c9c9">🗑️ Барлық прогресті тазалау</button>
    </div>
  `;
}

/* =========================================================================
   RENDER
   ========================================================================= */
function render(){
  renderSidebar();
  updateTopProgress();
  switch(route.name){
    case 'home': renderHome(); break;
    case 'topics': renderTopics(); break;
    case 'topic': renderTopic(route.param); break;
    case 'lab': renderLab(); break;
    case 'practice': renderPractice(); break;
    case 'project': renderProject(); break;
    case 'tests': renderTests(); break;
    case 'test': renderTest(route.param); break;
    case 'final': renderFinal(); break;
    case 'results': renderResults(); break;
    default: renderHome();
  }
}

/* =========================================================================
   EVENTS
   ========================================================================= */
document.addEventListener('click', (e)=>{
  const target = e.target.closest('[data-nav-btn],[data-nav-topic],[data-nav-test],[data-proj-type]');
  if(target){
    if(target.dataset.navBtn){ navigate(target.dataset.navBtn); return; }
    if(target.dataset.navTopic){ navigate('topic', target.dataset.navTopic); return; }
    if(target.dataset.navTest){ navigate('test', target.dataset.navTest); return; }
  }

  // SIDEBAR
  const nav = e.target.closest('.nav-item');
  if(nav){ navigate(nav.dataset.nav); return; }

  // QUIZ
  const qBtn = e.target.closest('[data-action]');
  if(qBtn){
    const act = qBtn.dataset.action;
    const qid = qBtn.dataset.quiz;
    if(act === 'quiz-submit'){ submitQuiz(qid); return; }
    if(act === 'quiz-reset'){ resetQuiz(qid); return; }
  }

  // MULTISELECT TASK
  const msCheck = e.target.closest('[data-ms-check]');
  if(msCheck){
    const id = msCheck.dataset.msCheck;
    const task = findTask(id);
    const st = MS_STATE[id] || new Set();
    const correct = task.correct;
    let ok = st.size === correct.length && correct.every(c=>st.has(c));
    const fb = document.getElementById('fb-'+id);
    if(ok){
      fb.className = 'feedback ok show';
      fb.innerHTML = '✓ Дұрыс! ' + task.explain;
      markTaskDone(id);
    } else {
      fb.className = 'feedback bad show';
      const missing = correct.filter(c=>!st.has(c)).length;
      const extra = [...st].filter(x=>!correct.includes(x)).length;
      fb.innerHTML = `✗ Толық дұрыс емес. Жетіспейтін дұрыс жауап: ${missing}, артық таңдалған: ${extra}. Қайта көріп, түзетіп көр.<br><span class="muted">${task.explain}</span>`;
    }
    return;
  }
  const msOpt = e.target.closest('[data-ms-opt]');
  if(msOpt){
    setTimeout(()=>{
      const id = msOpt.dataset.msOpt;
      const idx = Number(msOpt.dataset.idx);
      if(!MS_STATE[id]) MS_STATE[id] = new Set();
      if(MS_STATE[id].has(idx)) MS_STATE[id].delete(idx); else MS_STATE[id].add(idx);
      msOpt.classList.toggle('on', MS_STATE[id].has(idx));
    },0);
    return;
  }

  // FILLBLANKS
  const fbCheck = e.target.closest('[data-fb-check]');
  if(fbCheck){
    const id = fbCheck.dataset.fbCheck;
    const task = findTask(id);
    const st = FB_STATE[id] || {};
    let ok = true;
    task.blanks.forEach(b=>{
      if(st[b.row+'-'+b.key] !== b.answer) ok = false;
    });
    const fb = document.getElementById('fb-'+id);
    if(ok){
      fb.className = 'feedback ok show';
      fb.innerHTML = '✓ Керемет! Кесте дұрыс толтырылды. ' + task.explain;
      markTaskDone(id);
    } else {
      fb.className = 'feedback bad show';
      fb.innerHTML = '✗ Кейбір ұяшықтар қате толтырылған. Әр бағанның типіне назар аудар.<br><span class="muted">' + task.explain + '</span>';
    }
    return;
  }

  // CLICK ERRORS
  const ceCheck = e.target.closest('[data-ce-check]');
  if(ceCheck){
    const id = ceCheck.dataset.ceCheck;
    const task = findTask(id);
    const st = CE_STATE[id] || new Set();
    const correctSet = new Set(task.errors);
    let ok = st.size === correctSet.size && [...st].every(x=>correctSet.has(x));
    const fb = document.getElementById('fb-'+id);
    if(ok){
      fb.className = 'feedback ok show';
      fb.innerHTML = '✓ Дұрыс! Барлық қате табылды. ' + task.explain;
      markTaskDone(id);
    } else {
      fb.className = 'feedback bad show';
      const missed = task.errors.filter(x=>!st.has(x)).length;
      const wrongPick = [...st].filter(x=>!correctSet.has(x)).length;
      fb.innerHTML = `✗ Толық дұрыс емес. Табылмаған қате: ${missed}, қате таңдалған ұяшық: ${wrongPick}.<br><span class="muted">${task.explain}</span>`;
    }
    return;
  }
  const ceCell = e.target.closest('[data-ce]');
  if(ceCell){
    const id = ceCell.dataset.ce;
    const cell = ceCell.dataset.cell;
    if(!CE_STATE[id]) CE_STATE[id] = new Set();
    if(CE_STATE[id].has(cell)){ CE_STATE[id].delete(cell); ceCell.classList.remove('selected'); }
    else { CE_STATE[id].add(cell); ceCell.classList.add('selected'); }
    return;
  }

  // TABLE TASK
  const ttSort = e.target.closest('[data-tt-sort]');
  if(ttSort){
    const id = ttSort.dataset.ttSort;
    const key = ttSort.dataset.key;
    const task = findTask(id);
    const st = TT_STATE[id];
    if(st.sortKey === key) st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc';
    else { st.sortKey = key; st.sortDir = 'asc'; }
    ttRender(task);
    return;
  }
  const ttCheck = e.target.closest('[data-tt-check]');
  if(ttCheck){
    const id = ttCheck.dataset.ttCheck;
    const task = findTask(id);
    const st = TT_STATE[id];
    const rows = ttGetRows(task);
    const fb = document.getElementById('fb-'+id);
    let ok = false, msg = '';

    if(task.mode === 'find'){
      if(st._pickedId === undefined || st._pickedId === null){
        fb.className = 'feedback info show';
        fb.innerHTML = '⚠ Алдымен кестеден қажетті жолды басып таңда.';
        return;
      }
      ok = Number(st._pickedId) === Number(task.targetId);
      msg = ok ? '✓ Дұрыс! ' + task.explain : '✗ Басқа жолды таңдадың. Іздеу жолағын пайдаланып, қайта көр.<br><span class="muted">' + task.explain + '</span>';
    }
    if(task.mode === 'sort'){
      const key = task.required.key, dir = task.required.dir;
      if(!st.sortKey){
        fb.className = 'feedback info show';
        fb.innerHTML = '⚠ Алдымен кестені баған атауын басып сұрыпта.';
        return;
      }
      if(st.sortKey !== key){
        ok = false;
        msg = '✗ Сұрыптау басқа баған бойынша жасалды. Керек баған: <b>' + task.columns.find(c=>c.key===key).label + '</b>.<br><span class="muted">' + task.explain + '</span>';
      } else if(st.sortDir !== dir){
        ok = false;
        msg = '✗ Бағыт дұрыс емес. Керек бағыт: <b>' + (dir==='desc'?'кему ↓':'өсу ↑') + '</b>.<br><span class="muted">' + task.explain + '</span>';
      } else {
        ok = true;
        msg = '✓ Дұрыс! ' + task.explain;
      }
    }
    if(task.mode === 'filter'){
      const ids = rows.map(r=>Number(r.id)).sort((a,b)=>a-b);
      const exp = task.expectedIds.slice().sort((a,b)=>a-b);
      ok = ids.length === exp.length && ids.every((v,i)=>v===exp[i]);
      msg = ok ? '✓ Дұрыс! ' + task.explain
               : `✗ Нәтиже дұрыс емес. Көрсетілген жазба саны: ${rows.length}, керек: ${exp.length}.<br><span class="muted">${task.explain}</span>`;
    }
    fb.className = 'feedback ' + (ok ? 'ok show' : 'bad show');
    fb.innerHTML = msg;
    if(ok) markTaskDone(id);
    return;
  }
  const ttRow = e.target.closest('[data-tt-row]');
  if(ttRow){
    const id = ttRow.dataset.ttRow;
    const task = findTask(id);
    TT_STATE[id]._pickedId = ttRow.dataset.rowid;
    document.querySelectorAll(`[data-tt-body="${id}"] tbody tr`).forEach(tr=>tr.classList.remove('selected'));
    ttRow.classList.add('selected');
    return;
  }
  const ttClear = e.target.closest('[data-tt-clear]');
  if(ttClear){
    const id = ttClear.dataset.ttClear;
    const task = findTask(id);
    const st = TT_STATE[id];
    st.filters = {}; st.ops = {};
    document.querySelectorAll(`[data-tt-filter="${id}"]`).forEach(s=>s.value='');
    document.querySelectorAll(`[data-tt-num="${id}"]`).forEach(s=>s.value='');
    ttRender(task);
    return;
  }

  // DATA LAB
  const labLogic = e.target.closest('[data-lab-logic]');
  if(labLogic){ LAB.logic = labLogic.dataset.labLogic; renderLab(); return; }

  const condRm = e.target.closest('[data-cond-rm]');
  if(condRm){
    LAB.conds.splice(Number(condRm.dataset.condRm),1);
    renderLab();
    return;
  }
  if(e.target.id === 'labAddCond'){
    const ds = DATASETS[LAB.ds];
    LAB.conds.push({key:ds.columns[0].key, op:'=', value:''});
    renderLab();
    return;
  }
  if(e.target.id === 'labReset'){
    LAB.search=''; LAB.sortKey=null; LAB.sortDir='asc'; LAB.conds=[]; LAB.logic='AND';
    renderLab();
    return;
  }

  // PROJECT
  const pType = e.target.closest('[data-proj-type]');
  if(pType){
    const t = PROJECT_TYPES.find(x=>x.id===pType.dataset.projType);
    projectState.typeId = t.id;
    if(projectState.fields.length === 0) projectState.fields = [...t.fields];
    if(!projectState.title) projectState.title = t.name;
    saveProject(); renderProject();
    return;
  }
  const pAdd = e.target.closest('[data-proj-addfield]');
  if(pAdd){
    const f = pAdd.dataset.projAddfield;
    if(!projectState.fields.includes(f)) projectState.fields.push(f);
    saveProject(); renderProject();
    return;
  }
  const pRm = e.target.closest('[data-proj-rmfield]');
  if(pRm){
    const f = pRm.dataset.projRmfield;
    projectState.fields = projectState.fields.filter(x=>x!==f);
    projectState.rows.forEach(r=>delete r[f]);
    saveProject(); renderProject();
    return;
  }
  if(e.target.id === 'projAddCustom'){
    const v = document.getElementById('projNewField').value.trim();
    if(v && !projectState.fields.includes(v)){ projectState.fields.push(v); saveProject(); renderProject(); }
    return;
  }
  if(e.target.id === 'projAddRow'){
    const row = {};
    projectState.fields.forEach(f=>row[f]='');
    projectState.rows.push(row);
    saveProject(); renderProject();
    return;
  }
  const pDel = e.target.closest('[data-proj-delrow]');
  if(pDel){
    projectState.rows.splice(Number(pDel.dataset.projDelrow),1);
    saveProject(); renderProject();
    return;
  }
  if(e.target.id === 'projResetFilters'){
    projectState._search=''; projectState._sortKey=null; projectState._filterKey=''; projectState._filterVal='';
    saveProject(); renderProject();
    return;
  }
  if(e.target.id === 'projEvaluate'){
    projectState.score = projectScore();
    saveProject(); renderProjResult();
    const el = document.getElementById('projResult');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  // RESULTS RESET
  if(e.target.id === 'resetProgress'){
    if(confirm('Барлық прогресс тазаланады. Жалғастырасыз ба?')){
      progress = {topics:{}, final:null, project:null};
      saveProgress();
      projectState = null; initProjectState();
      render();
    }
    return;
  }
});

/* input/change делегациясы */
document.addEventListener('change', (e)=>{
  // TT filter
  if(e.target.dataset.ttFilter){
    const id = e.target.dataset.ttFilter;
    const key = e.target.dataset.key;
    const task = findTask(id);
    TT_STATE[id].filters[key] = e.target.value;
    ttRender(task);
    return;
  }
  if(e.target.dataset.ttOp){
    const id = e.target.dataset.ttOp;
    const key = e.target.dataset.key;
    TT_STATE[id].ops[key] = e.target.value;
    return;
  }
  if(e.target.dataset.fb){
    const id = e.target.dataset.fb;
    if(!FB_STATE[id]) FB_STATE[id] = {};
    FB_STATE[id][e.target.dataset.row + '-' + e.target.dataset.key] = e.target.value;
    return;
  }
  // LAB
  if(e.target.id === 'labDs'){ LAB.ds = e.target.value; LAB.conds=[]; LAB.sortKey=null; renderLab(); return; }
  if(e.target.id === 'labSortKey'){ LAB.sortKey = e.target.value || null; renderLab(); return; }
  if(e.target.id === 'labSortDir'){ LAB.sortDir = e.target.value; renderLab(); return; }
  if(e.target.dataset.condKey){ LAB.conds[Number(e.target.dataset.condKey)].key = e.target.value; renderLab(); return; }
  if(e.target.dataset.condOp){ LAB.conds[Number(e.target.dataset.condOp)].op = e.target.value; renderLab(); return; }
  // PROJECT
  if(e.target.id === 'projSortKey'){ projectState._sortKey = e.target.value || null; if(e.target.value) projectState.done.sort = true; saveProject(); renderProject(); return; }
  if(e.target.id === 'projSortDir'){ projectState._sortDir = e.target.value; saveProject(); renderProject(); return; }
  if(e.target.id === 'projFilterKey'){ projectState._filterKey = e.target.value; saveProject(); renderProject(); return; }
  if(e.target.dataset.projCell !== undefined){
    const ri = Number(e.target.dataset.projCell);
    const key = e.target.dataset.key;
    projectState.rows[ri][key] = e.target.value;
    saveProject();
    return;
  }
});

document.addEventListener('input', (e)=>{
  if(e.target.dataset.ttSearch){
    const id = e.target.dataset.ttSearch;
    const task = findTask(id);
    TT_STATE[id].search = e.target.value;
    ttRender(task);
    return;
  }
  if(e.target.dataset.ttNum){
    const id = e.target.dataset.ttNum;
    const key = e.target.dataset.key;
    const task = findTask(id);
    TT_STATE[id].filters[key] = e.target.value;
    ttRender(task);
    return;
  }
  if(e.target.id === 'labSearch'){ LAB.search = e.target.value; renderLab(); return; }
  if(e.target.dataset.condVal !== undefined){
    const i = Number(e.target.dataset.condVal);
    LAB.conds[i].value = e.target.value;
    // рендерсіз тек кестені жаңарту
    const wrap = document.querySelector('.content .tablewrap');
    const ds = DATASETS[LAB.ds];
    const rows = labQuery();
    if(wrap) wrap.outerHTML = tableHTML(ds.columns, rows, {sortable:true, sortKey:LAB.sortKey, sortDir:LAB.sortDir, tableId:'lab'});
    const meta = document.querySelector('.lab-meta');
    if(meta) meta.querySelector('span b').textContent = rows.length;
    return;
  }
  if(e.target.id === 'projTitle'){ projectState.title = e.target.value; saveProject(); return; }
  if(e.target.id === 'projSearch'){ projectState._search = e.target.value; if(e.target.value.trim()) projectState.done.search = true; saveProject(); renderProjTable(); updateProjMeta(); return; }
  if(e.target.id === 'projFilterVal'){ projectState._filterVal = e.target.value; if(e.target.value.trim()) projectState.done.filter = true; saveProject(); renderProjTable(); updateProjMeta(); return; }
  if(e.target.id === 'projConclusion'){ projectState.conclusion = e.target.value; saveProject(); return; }
});

function updateProjMeta(){
  const meta = document.querySelector('.lab-meta');
  if(!meta) return;
  const s = projectState;
  meta.innerHTML = `
    <span>Көрсетілген жазба: <b>${s._viewRows ? s._viewRows.length : s.rows.length}</b> / ${s.rows.length}</span>
    <span>Іздеу: <b>${s.done.search?'✓ орындалды':'—'}</b></span>
    <span>Сұрыптау: <b>${s.done.sort?'✓ орындалды':'—'}</b></span>
    <span>Сүзгілеу: <b>${s.done.filter?'✓ орындалды':'—'}</b></span>`;
}

function findTask(id){
  for(const t of TOPICS){
    const task = t.tasks.find(x=>x.id===id);
    if(task) return task;
  }
  return null;
}

function markTaskDone(taskId){
  for(const t of TOPICS){
    if(t.tasks.some(x=>x.id===taskId)){
      const p = topicProg(t.id);
      p.tasks[taskId] = true;
      saveProgress();
      // тапсырма тақырыбының жанындағы белгіні жаңарту
      const head = document.querySelector(`[data-task-id="${taskId}"] .task-title`);
      if(head && !head.querySelector('.badge')){
        head.insertAdjacentHTML('beforeend','<span class="badge" style="background:var(--ok);color:#fff;border-radius:20px;padding:2px 9px;font-size:11px;margin-left:8px">✓ орындалды</span>');
      }
      break;
    }
  }
}

/* ------------------------ SIDEBAR / SEARCH ------------------------------ */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
document.getElementById('hamburger').addEventListener('click', ()=>{
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
});
overlay.addEventListener('click', closeSidebar);

const gSearch = document.getElementById('globalSearch');
const sResults = document.getElementById('searchResults');
gSearch.addEventListener('input', ()=>{
  const q = gSearch.value.trim().toLowerCase();
  if(q.length < 2){ sResults.style.display = 'none'; return; }
  const items = [];
  TOPICS.forEach(t=>{
    if(t.title.toLowerCase().includes(q) || t.num.includes(q) || t.short.toLowerCase().includes(q)){
      items.push({label:`📘 ${t.num}. ${t.title}`, route:'topic', param:t.id});
    }
    t.tasks.forEach(task=>{
      if(task.title.toLowerCase().includes(q)) items.push({label:`🧩 ${task.title} (${t.num})`, route:'topic', param:t.id});
    });
  });
  Object.keys(DATASETS).forEach(k=>{
    if(DATASETS[k].title.toLowerCase().includes(q)) items.push({label:`🧪 ${DATASETS[k].title}`, route:'lab', param:null});
  });
  if('data lab зертхана'.includes(q)) items.push({label:'🧪 Data Lab', route:'lab', param:null});
  if('мини-жоба жоба project'.includes(q)) items.push({label:'🛠️ Мини-жоба', route:'project', param:null});
  if('қорытынды тест final'.includes(q)) items.push({label:'🎯 Қорытынды тест', route:'final', param:null});
  if('нәтиже results'.includes(q)) items.push({label:'📊 Менің нәтижелерім', route:'results', param:null});

  if(items.length === 0){ sResults.style.display='none'; return; }
  sResults.innerHTML = items.slice(0,8).map((it,i)=>`<div data-si="${i}">${it.label}</div>`).join('');
  sResults.style.display = 'block';
  sResults.querySelectorAll('[data-si]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const it = items[Number(el.dataset.si)];
      sResults.style.display = 'none';
      gSearch.value = '';
      navigate(it.route, it.param);
    });
  });
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('#searchResults') && !e.target.closest('.searchbar')) sResults.style.display = 'none';
});

/* =========================================================================
   INIT
   ========================================================================= */
registerQuizzes();
initProjectState();
render();
</script>
